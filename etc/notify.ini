# Configuration for loginnode-notify. Relative paths are relative to the
# directory holding the loginnode-notify script. Indent continuation lines.
#
# Personal settings (sender, signature, ...) go in etc/notify.local.ini, which
# overrides anything here and is not committed; see notify.local.ini.example.
[notify]

# --- identity (set yours in notify.local.ini) -------------------------------
# From: address. Empty = your own address in the HPC directory.
mail_from =
# Reply-To: address. Empty = mail_from.
reply_to =
# Only used for Message-ID headers. Recipients are NOT <netid>@yale.edu (that
# address is silently dropped); see the recipient addresses section below.
mail_domain = yale.edu
# selftest and send --self-test mail this netID's directory address, looked up
# exactly like a real recipient's. Empty = $USER.
self_test_netid =
# Appended to every message via {{SIGNATURE}}. Indent continuation lines.
signature =
# Used when a draft has no Subject: header.
default_subject = login node usage on Bouchet

# --- where to look ----------------------------------------------------------
# detect always scans the host it runs on; --all-nodes also ssh-es to these
# (needs the shared home so the script and config are visible there).
login_nodes = login1 login2
ssh = ssh -o BatchMode=yes -o ConnectTimeout=8

# --- what counts --------------------------------------------------------------
# Ignore processes younger than this many seconds.
min_etime = 600
# A process above this RSS (MB) is reported as "heavy" even if no pattern matches.
heavy_rss_mb = 2048
# Servers older than this many days in these categories are orphans: marked
# stale and not selected (they need a cleanup, not an email). 0 disables.
stale_etime_days = 30
stale_categories = ide ide_server

# --- how often --------------------------------------------------------------
# Nobody is mailed twice within this many days (any category); enforced again
# by send right before delivery.
cooldown_days = 14
# Per-run cap; review/send take --max-recipients to raise it deliberately.
max_recipients = 200
# 0 = etc/excluded.txt entries are permanent; N = an entry expires N days
# after the date in its second field.
exclude_days = 0

# --- delivery ---------------------------------------------------------------
# Called as: sendmail -t -oi [-f envelope_from] with the message on stdin.
sendmail = /usr/sbin/sendmail
# Envelope sender (where bounces go). Empty = the local default (<you>@<host>).
envelope_from =

# --- recipient addresses ----------------------------------------------------
# Each recipient's address is the `mail` attribute in the HPC directory, read
# with YCRC's /apps/bin/ycrc_ldap.py under the ycrc_utilities python (which has
# ldap3). etc/addresses.tsv (netID<TAB>address) overrides it per user. Users
# with no address are skipped by send. Empty ldap_helper_dir = override file only.
ldap_python = /apps/services/ycrc_utilities/bin/python3
ldap_helper_dir = /apps/bin

# --- names ------------------------------------------------------------------
finger = finger
# 1 = "Dear Athena", 0 = "Dear Athena Papadopoulos"
name_greeting_first = 1
